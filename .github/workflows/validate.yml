name: Validate signatures

# The CI gate: every signature must compile, pass its own test samples, and - independently of
# those samples - score zero matches against corpus/clean/. Runs on every push and PR so a bad
# signature can never land on main, whether it came from a human contributor or a pull request.

on:
  push:
    branches: ['**']
  pull_request: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - run: php scripts/validate_signatures.php
      - run: php scripts/test_discover.php
