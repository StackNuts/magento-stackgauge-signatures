name: Propose new signatures

# Searches the web with Tavily and asks Cloudflare Workers AI to turn the results into candidate
# signatures for current Magento/Adobe
# Commerce webshell and Magecart indicators of compromise, auto-validates every candidate
# locally, and opens a PULL REQUEST for human review. AI-written detection is never merged
# automatically - the validate.yml gate runs again on the PR itself regardless.
#
# Setup (once):
#   gh secret set CLOUDFLARE_API_KEY --repo StackNuts/magento-stackgauge-signatures
#   gh secret set CLOUDFLARE_ACCOUNT_ID --repo StackNuts/magento-stackgauge-signatures
#   gh secret set TAVILY_API_KEY --repo StackNuts/magento-stackgauge-signatures
#   gh secret set BRAVE_SEARCH_API_KEY --repo StackNuts/magento-stackgauge-signatures
#   # optional model override (default @cf/meta/llama-3.3-70b-instruct-fp8-fast):
#   gh variable set WORKERS_AI_MODEL --repo StackNuts/magento-stackgauge-signatures --body @cf/meta/llama-3.3-70b-instruct-fp8-fast
#   # allow Actions to open PRs:
#   gh api -X PUT repos/StackNuts/magento-stackgauge-signatures/actions/permissions/workflow \
#     -F default_workflow_permissions=write -F can_approve_pull_request_reviews=true

on:
  schedule:
    - cron: '0 9 * * *'    # daily 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: propose-signatures
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Processed-source state lives on the "state" branch so it persists between runs. The first
      # run has no state branch yet; the save step creates it.
      - name: Check out state branch
        uses: actions/checkout@v4
        with:
          ref: state
          path: state
          fetch-depth: 1
        continue-on-error: true

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Generate candidate signatures
        env:
          STATE_PATH: ${{ github.workspace }}/state/processed_sources.json
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
        run: php scripts/propose_signatures.php

      - name: Open / update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- signatures.json; then
            echo "No vetted signatures to propose."
            exit 0
          fi
          BRANCH=auto/new-signatures
          git config user.name "stacknuts-bot"
          git config user.email "stack.nuts@outlook.com"
          git checkout -b "$BRANCH"
          git add signatures.json
          git commit -m "Propose new detection signatures"
          git push -f origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Proposed detection signatures (auto-validated - review before merge)" \
              --body-file pr_body.md
          else
            echo "PR already open for $BRANCH; branch updated with the latest proposal."
          fi

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propose-signatures-debug
          path: propose_debug.log
          if-no-files-found: ignore

      - name: Save processed-source state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ ! -d state/.git ]; then
            mkdir -p state
            git -C state init -q
            git -C state checkout -q -b state
            git -C state remote add origin "https://github.com/${{ github.repository }}.git"
            git -C state config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          fi
          cd state
          if [ ! -f processed_sources.json ]; then
            echo "No state written this run."
            exit 0
          fi
          git config user.name "stacknuts-bot"
          git config user.email "stack.nuts@outlook.com"
          git add processed_sources.json
          if git diff --cached --quiet; then
            echo "State unchanged."
            exit 0
          fi
          git commit -q -m "Update processed-source state"
          git push origin HEAD:state
